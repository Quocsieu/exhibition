services:
  - type: web
    name: virtual-expo-be
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w BE
    startCommand: npm run start -w BE
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: "*"
      - key: SQLITE_DB_PATH
        value: ./data/expo.db
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
