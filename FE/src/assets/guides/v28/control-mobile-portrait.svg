<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="Minh họa điều khiển điện thoại dọc: vuốt nửa trên để xoay camera, kéo nửa dưới để di chuyển bằng joystick 360 độ">
  <rect width="320" height="260" rx="16" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="258" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Phone Portrait Frame -->
  <rect x="86" y="14" width="148" height="232" rx="22" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
  <rect x="136" y="22" width="48" height="5" rx="2.5" fill="#475569"/>

  <!-- Top half: Camera Rotate Zone -->
  <rect x="94" y="34" width="132" height="96" rx="10" fill="rgba(56,189,248,0.16)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M132 76 C146 62, 174 62, 188 76" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M182 69 l7 8 l-10 1" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M138 69 l-7 8 l10 1" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="102" text-anchor="middle" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VUỐT NỬA TRÊN</text>
  <text x="160" y="118" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10">Xoay góc nhìn</text>

  <!-- Bottom half: Floating 360 Joystick Zone -->
  <rect x="94" y="138" width="132" height="98" rx="10" fill="rgba(52,211,153,0.16)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="160" cy="174" r="24" fill="rgba(15,23,42,0.55)" stroke="#34d399" stroke-width="2"/>
  <circle cx="168" cy="168" r="10" fill="#34d399"/>
  <text x="160" y="214" text-anchor="middle" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">KÉO NỬA DƯỚI</text>
  <text x="160" y="229" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">Joystick 360° di chuyển</text>
</svg>
