<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Minh họa điều khiển trên máy tính: WASD di chuyển, nhấp sàn để đi tới, kéo chuột xoay góc nhìn, cuộn để thu phóng">
  <rect width="560" height="220" rx="16" fill="#0f172a"/>
  <rect x="1" y="1" width="558" height="218" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left panel: WASD / Arrow keys -->
  <rect x="16" y="16" width="172" height="188" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="102" y="40" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DI CHUYỂN</text>
  <!-- W key -->
  <rect x="82" y="56" width="40" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="102" y="79" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">W</text>
  <!-- A S D keys -->
  <rect x="36" y="98" width="40" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="56" y="121" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">A</text>
  <rect x="82" y="98" width="40" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="102" y="121" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">S</text>
  <rect x="128" y="98" width="40" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="148" y="121" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">D</text>
  <text x="102" y="158" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Phím WASD / Mũi tên</text>
  <text x="102" y="176" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Bước đi trong sảnh</text>

  <!-- Center panel: Mouse drag & wheel -->
  <rect x="200" y="16" width="160" height="188" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="280" y="40" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">XOAY &amp; THU PHÓNG</text>
  <!-- Mouse body -->
  <rect x="252" y="58" width="56" height="78" rx="26" fill="#0f172a" stroke="#34d399" stroke-width="1.8"/>
  <line x1="280" y1="58" x2="280" y2="94" stroke="#34d399" stroke-width="1.5"/>
  <line x1="252" y1="94" x2="308" y2="94" stroke="#334155" stroke-width="1.5"/>
  <rect x="276" y="69" width="8" height="16" rx="4" fill="#34d399"/>
  <!-- Left/right arrows -->
  <path d="M236 97 l-12 0 m4 -5 l-5 5 l5 5" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M324 97 l12 0 m-4 -5 l5 5 l-5 5" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="280" y="158" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Kéo chuột: Xoay góc nhìn</text>
  <text x="280" y="176" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cuộn giữa: Phóng to / nhỏ</text>

  <!-- Right panel: Click to move & interact -->
  <rect x="372" y="16" width="172" height="188" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="458" y="40" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CHỌN &amp; ĐI TỚI</text>
  <ellipse cx="458" cy="112" rx="44" ry="18" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="458" cy="112" r="6" fill="#fbbf24"/>
  <path d="M458 64 l0 34 m-7 -8 l7 9 l7 -9" fill="none" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="458" y="158" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">Nhấp sàn: Tự động đi tới</text>
  <text x="458" y="176" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Nhấp gian / SP / NPC</text>
</svg>
